<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>在席ボード（出勤/退勤/リモート）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="box">
    <h1>在席ボード</h1>
    <div class="row">
      <div>Room: <code id="room"></code></div>
      <input id="shareUrl" readonly />
      <button id="copyUrl">URLコピー</button>
    </div>
    <p class="hint">同じ <code>?room=xxxx</code> のURLを別タブで開くと状態が同期されます（同一オリジンのタブ間通信：BroadcastChannel）。</p>
  </header>

  <section class="box">
    <h2>メンバー設定</h2>
    <p class="hint">「名前を1行ずつ」入力 → 保存。例：山田太郎</p>
    <textarea id="names" placeholder="名前を1行ずつ入力"></textarea>
    <div class="row">
      <button id="saveNames">名前を保存</button>
      <button id="resetAll" class="danger">全員を退勤にする</button>
    </div>
  </section>

  <section class="box">
    <h2>ステータス</h2>
    <div class="legend">
      <span class="badge in">出勤</span>
      <span class="badge remote">リモート</span>
      <span class="badge out">退勤</span>
      <span class="small">最終更新: <span id="updated">-</span></span>
    </div>

    <div id="board" class="board"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
