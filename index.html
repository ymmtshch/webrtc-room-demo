<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebRTC Room Demo (No Server Signaling)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .box { border:1px solid #ddd; padding:12px; border-radius:8px; margin-top:12px; }
    input, textarea { width: min(720px, 100%); }
    textarea { height: 140px; }
    code { background:#f6f6f6; padding:2px 6px; border-radius:6px; }
    .small { color:#666; font-size: 0.9em; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>WebRTC Room Demo (Step 3-3 Complete)</h1>

  <div class="box">
    <div>Room: <code id="room"></code></div>
    <div class="small">同じ <code>?room=xxxx</code> のURLを<strong>別タブ</strong>で開くと接続します。</div>

    <div class="row" style="margin-top:10px;">
      <button id="create-offer">Create Offer (Caller)</button>
      <span>Connection: <code id="conn">-</code></span>
      <span>ICE: <code id="ice">-</code></span>
    </div>

    <div style="margin-top:10px;">
      Share URL:
      <input id="shareUrl" readonly />
      <button id="copyUrl">Copy</button>
    </div>
  </div>

  <div class="box">
    <h2>DataChannel Chat</h2>
    <div class="row">
      <input id="msg" placeholder="Type message..." />
      <button id="send" disabled>Send</button>
    </div>
    <textarea id="log" readonly></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
